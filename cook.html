<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooking Frenzy</title>

    <link rel="stylesheet" href="cook.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap" rel="stylesheet">
</head>

<body>

    <h1 class="box">
        <span class="title-text">Cooking Frenzy</span>
    </h1>

    <!-- Food -->
    <img src="fries.png" class="food fries" onclick="handleFoodClick('fries')">
    <img src="hamburger.webp" class="food hamburger" onclick="handleFoodClick('burger')">
    <img src="ketchup.png" class="food ketchup" onclick="handleFoodClick('ketchup')">
    <img src="milkshake.avif" class="food milkshake" onclick="handleFoodClick('milkshake')">
    <img src="mustard.avif" class="food mustard" onclick="handleFoodClick('mustard')">
    <img src="soda.png" class="food soda" onclick="handleFoodClick('soda')">

    <!-- Receipt -->
    <div class="receipt-container">
        <img src="receipt.png" class="receipt">

        <div class="receipt-content">
            <h2 id="centered">Order</h2>
            <div id="receipt"></div>
        </div>
    </div>

    <!-- Timer & Score-->
    <div id="timer">Time: 0</div>
    <div id="score">Score: 0</div>

    <!-- Script -->
    <script src="cook.js"></script>
</body>
</html>
